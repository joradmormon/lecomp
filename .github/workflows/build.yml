name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build (sin firmar)
        run: |
          xcodebuild -project GestaltX.xcodeproj -scheme GestaltX \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GestaltX.app Payload/
          zip -r GestaltX.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GestaltX-unsigned
          path: GestaltX.ipa
